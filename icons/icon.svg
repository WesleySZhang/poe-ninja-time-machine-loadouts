<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Source for the PNG icons (tools/icons.js). A clock with a rewind arrow: the time machine. -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="#1f2430"/>
  <rect x="4" y="4" width="120" height="120" rx="26" fill="none" stroke="#3a4152" stroke-width="4"/>
  <!-- Rewind arc: most of a circle, open at the top left, arrow head pointing back (anticlockwise). -->
  <path d="M 37.5 43 A 33 33 0 1 1 31 66" fill="none" stroke="#5b9be6" stroke-width="11" stroke-linecap="round"/>
  <path d="M 20 38 L 46 32 L 40 58 Z" fill="#5b9be6" stroke="#5b9be6" stroke-width="4" stroke-linejoin="round"/>
  <!-- Clock hands. -->
  <path d="M 64 44 L 64 66 L 80 76" fill="none" stroke="#e6e6e6" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
